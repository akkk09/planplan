name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      deployments: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
          retention-days: 1
      - name: Cancel stale Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_BUILD: 44d16f8087d83dac59682e211407b98799fc7f0f
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_PAGES_BUILD}/cancel")
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then
            echo "Unexpected response while cancelling stale Pages build: HTTP $status"
            exit 1
          fi
          echo "Pages build cancellation returned HTTP $status."

      - name: Remove stale deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_PAGES_BUILD: 44d16f8087d83dac59682e211407b98799fc7f0f
        run: |
          deployments=$(curl --silent --show-error --fail \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${STALE_PAGES_BUILD}&per_page=100")

          ids=$(printf '%s' "$deployments" | jq -r '.[].id')
          if [ -z "$ids" ]; then
            echo "No stale deployment records found."
            exit 0
          fi

          while IFS= read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            echo "Marking stale deployment $deployment_id inactive."
            curl --silent --show-error --fail \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data '{"state":"inactive","description":"Removing a stale GitHub Pages deployment left by an interrupted run."}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" >/dev/null

            curl --silent --show-error --fail \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}" >/dev/null
            echo "Removed stale deployment $deployment_id."
          done <<< "$ids"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
